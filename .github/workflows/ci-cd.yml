name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:

  unit-tests:
    name: Pruebas Unitarias (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar Pytest con cobertura (mínimo 80%)
        run: python -m pytest

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  e2e-tests:
    name: Pruebas E2E (Selenium)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Levantar la aplicación en segundo plano
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-secret-key
        run: |
          python manage.py syncdb
          nohup python run.py > flask.log 2>&1 &
          npx wait-on http://localhost:5000/api/health --timeout 30000

      - name: Ejecutar pruebas Selenium (headless en CI)
        run: python -m pytest tests_e2e/ -v

      - name: Mostrar logs de Flask si algo falla
        if: failure()
        run: cat flask.log

  docker-build:
    name: Compilar Imagen Docker
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: py-url-shortener:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Reporte de Seguridad
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Auditoría de dependencias (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format markdown --output pip-audit-report.md || true

      - name: Subir reporte de seguridad
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: pip-audit-report.md

  deploy:
    name: Desplegar a Producción
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, docker-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Disparar despliegue (Deploy Hook de la plataforma elegida)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$DEPLOY_HOOK_URL"

      - name: Verificar salud del despliegue
        run: |
          sleep 20
          curl -fsS "${{ secrets.PRODUCTION_URL }}/api/health"